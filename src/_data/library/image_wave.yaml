# Image Wave
# images    -> array of { src, alt }. Any number of entries.
# repeat    -> times the images repeat inside one set; one set must be wider
#              than the screen or the loop shows a gap (default 1)
# speed     -> seconds for the marquee to pan one full set (default 60)
# duration  -> seconds for one full up-and-down bob (default 4)
# amplitude -> px each card travels up and down from centre (default 32)
# waves     -> crests of the wave across one set; sets the lag between
#              neighbouring cards (default 1)
# scrub     -> ties the marquee to scroll; 1 shifts it 1px per 1px scrolled,
#              higher is more sensitive, 0 (default) is off
# class     -> optional extra css class

scrub: 0.5
images:
  - src: /static/img/img-sample-1.jpg
    alt: Sample image one
  - src: /static/img/img-sample-2.jpg
    alt: Sample image two
  - src: /static/img/img-sample-3.jpg
    alt: Sample image three
  - src: /static/img/img-sample-4.jpg
    alt: Sample image four
  - src: /static/img/img-sample-5.jpg
    alt: Sample image five
  - src: /static/img/img-sample-6.jpg
    alt: Sample image six
  - src: /static/img/img-sample-7.jpg
    alt: Sample image seven
  - src: /static/img/img-sample-8.jpg
    alt: Sample image eight
