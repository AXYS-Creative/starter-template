# Image Fan
# arc        -> degrees the fan wraps: 0 = flat row, 90 = quarter circle,
#               180 = semicircle, 360 = full ring
# gap        -> spacing between cards as a multiple of card width
#               (1 = edges touching, >1 = space between, <1 = overlap)
# closed     -> true = spread evenly around a full 360 ring (ignores `arc`)
# direction  -> up (rainbow, middle card highest) | down (valley)
# item_width -> card width as a % of the component's own width (22 = 22%);
#               the whole fan scales with its parent container
# stack      -> sequence (stack in array order) | pyramid (centre card on top,
#               stepping down symmetrically to the first and last)

arc: 90
gap: 0.9
closed: false
direction: up
item_width: 20
stack: pyramid
images:
  - src: /static/img/img-sample-1.jpg
    alt: Sample image one
  - src: /static/img/img-sample-2.jpg
    alt: Sample image two
