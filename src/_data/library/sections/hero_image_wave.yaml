eyebrow: "Hero Variant"
title: "Hero Image Wave"
description: "A centered hero with an accent flourish and a wave of images beneath the content."
accent: "Hand-crafted"

cta_1:
  text: Visit Library
  text_desc: Visit our component library
  url: /library/components
  new_tab: false
cta_2:
  text: Get Started
  text_desc: Get started with AXYS Creative
  url: https://axyscreative.com/
  new_tab: true
  icon_end: /static/img/icon-google-chevron-right.svg

# Image wave config — every field is optional, values below are the defaults
# except scrub (off by default).
wave:
  speed: 40
  duration: 10
  scrub: 0.5 # marquee follows scroll; 1 = 1px per 1px scrolled, 0 = off
  amplitude: 48 # px each card travels up/down from centre (wave height), 0 = flat
  waves: 1 # stagger — whole crests across one set (rounded; fractions break the seamless loop); higher = tighter ripple, 0 = all cards in sync

