# Image Circle
# item_width -> card width as a % of the component's own width (24 = 24%);
#               the whole ring scales with its parent container
# gap        -> spacing between card centres as a multiple of card width
#               (1 = edges touching, >1 = space between, <1 = overlap)
# direction  -> left | right — which way the ring spins
# duration   -> seconds for one full orbit
# bloom      -> left | right | top, optional — cards stop counter-rotating
#               upright and instead rotate individually to stay radially
#               oriented like petals, with the left/right/top-most card
#               upright

item_width: 20
gap: 1.15
direction: left
duration: 40
images:
  - src: /static/img/img-sample-1.jpg
    alt: Sample image one
  - src: /static/img/img-sample-2.jpg
