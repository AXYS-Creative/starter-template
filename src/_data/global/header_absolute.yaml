# menu-links.njk
menu_links:
  - text: Platform
    url: "/"
    path: "#"
    new_tab: false
    type: text
    # size: sm
    class: menu-links__link
  - text: Culture
    url: "/blog"
    path: "archive-blog"
    new_tab: false
    type: text
    # size: sm
    class: menu-links__link
  - text: About
    text_desc: Get started with AXYS Creative
    url: "https://axyscreative.com"
    new_tab: true
    type: text
    # size: sm
    class: menu-links__link
    attributes: "data-hover-alt"
    # icon_end: /static/img/icon-google-chevron-right.svg
    # icon_start: /static/img/icon-google-info-circle.svg
  - text: OSS
    # text_desc:
    url: /admin
    icon_end: ""
    new_tab: true
    type: text
    # size: sm
    class: menu-links__link

# mobile nav specific content
lock_body_scroll: true # nav.njk Locks body scroll when nav is open

nav_btn:
  # text: menu
  type: button # button | icon
  symbol: stairs # burger | chocolate | kebab | stairs
  shape: round # sharp | round
  class: header-absolute # -> site-nav-btn--{{ class }} on the button
  # display: md # Dev use only

nav_footer:
  links:
    - text: Privacy Policy
      url: "/privacy-policy"
      new_tab: false
    - text: Terms of Service
      url: "/terms-of-service"
      new_tab: false
  social_media: true
  admin_login: true
